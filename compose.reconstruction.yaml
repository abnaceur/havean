# Optional local CLI build/verification; no coordinator, credentials or host port.
services:
  colmap-dependency-resolver:
    image: haven-colmap-resolver:discovery-3.10-2
    profiles: [reconstruction-build]
    build:
      context: .
      dockerfile: services/property-processing/Dockerfile.colmap
      target: resolve
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    tmpfs: ['/tmp:size=67108864,mode=1777']
  processing-colmap-smoke:
    profiles: [reconstruction-smoke]
    image: haven-processing-colmap:3.10-2-cpu-v1
    build:
      context: .
      dockerfile: services/property-processing/Dockerfile.colmap
      target: cpu
    init: true
    network_mode: none
    read_only: true
    user: '10001:10001'
    group_add: ['1000']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8g
    cpus: 2
    pids_limit: 128
    tmpfs: ['/tmp:size=67108864,mode=1777']
    volumes:
      - ./infra/generated/reconstruction/tum-xyz-input:/input:ro
      - ./infra/generated/reconstruction/results:/results
    command: [python, -m, property_processing.colmap_cli, --input, /input, --output, /results/tum-xyz-cpu, --max-seconds, '240']
