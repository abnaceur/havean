name: haven-property-capture-assets
services:
  encode:
    image: mwader/static-ffmpeg:7.1.1
    network_mode: none
    entrypoint: /ffmpeg
    volumes:
      - ./assets/digitization-property-capture:/assets
    command: ['-y', '-framerate', '1', '-i', '/assets/frame%03d.png', '-vf', 'scale=512:384,fps=12', '-c:v', 'libx264', '-crf', '18', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', '/assets/studio-walkthrough.mp4']
