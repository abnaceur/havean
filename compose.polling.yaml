# Optional development override for hosts whose shared inotify quota is exhausted.
# Does not change the production package or host kernel settings.
services:
  web:
    working_dir: /workspace/apps/web
    command: [sh, -c, 'node scripts/copy-maplibre-worker.mjs && pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000']
    environment:
      WATCHPACK_POLLING: '1000'
      NEXT_DIST_DIR: .next-polling
  ops:
    working_dir: /workspace/apps/ops
    command: [pnpm, exec, next, dev, --webpack, --hostname, 0.0.0.0, --port, '3001']
    environment:
      WATCHPACK_POLLING: '1000'
      NEXT_DIST_DIR: .next-polling
  proxy:
    volumes:
      - ./infra/traefik-polling.yml:/etc/traefik/traefik.yml:ro
